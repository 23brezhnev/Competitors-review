name: Weekly competitor report

on:
  schedule:
    # Monday 06:00 UTC = 09:00 MSK. GitHub cron is always UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:        # allows running it manually from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # the job needs minutes, not the 60s a serverless function gets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m pipeline.run_weekly
